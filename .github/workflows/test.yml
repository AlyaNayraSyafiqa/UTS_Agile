name: Automation Test - UTS Agile

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  # ============ PHP Syntax Check ============
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check PHP syntax
        run: |
          echo "Memeriksa semua file PHP di root dan folder pages..."
          for file in $(find . -name "*.php"); do
            php -l $file || exit 1
          done
          echo "Semua file PHP valid"

  # ============ Asset Check ============
  asset-check:
    name: Asset Check (logo.png and style.css)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check logo.png
        run: |
          test -f logo.png && echo "logo.png OK" || (echo "logo.png tidak ditemukan" && exit 1)
      - name: Check style.css
        run: |
          test -f style.css && echo "style.css OK" || (echo "style.css tidak ditemukan" && exit 1)

  # ============ Cek Semua Halaman Wajib (di folder pages) ============
  check-pages:
    name: Check All Required Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required pages
        run: |
          echo "Memeriksa halaman wajib di folder pages..."
          for page in home.php tentang.php ekosistem.php investor.php karir.php kontak.php; do
            test -f "pages/$page" && echo "pages/$page OK" || (echo "pages/$page hilang" && exit 1)
          done
          echo "Memeriksa index.php di root..."
          test -f index.php && echo "index.php OK" || (echo "index.php hilang" && exit 1)
          echo "Semua halaman lengkap"

  # ============ Cek Debug Code ============
  no-debug:
    name: Check Debug Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check var_dump, print_r, dd
        run: |
          if grep -r "var_dump\|print_r\|dd(" --include="*.php" .; then
            echo "Debug code ditemukan! Hapus sebelum merge."
            exit 1
          fi
          echo "Tidak ada debug code"